services:

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mokart-app
    ports:
      - "8000:3000"
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:8081
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mokart-web
    ports:
      - "8080:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mokart-api
    ports:
      - "8081:5000"
    volumes:
      - ./api:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: mokart-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  nocodb:
    build:
      context: .
      dockerfile: nocodb/Dockerfile
    container_name: mokart-nocodb
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      - NC_DB=pg://db:5432?u=${DB_USER}&p=${DB_PASSWORD}&d=nocodb
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET}
      - NC_ADMIN_EMAIL=${NC_ADMIN_EMAIL}
      - NC_ADMIN_PASSWORD=${NC_ADMIN_PASSWORD}
      - NC_PUBLIC_URL=http://localhost:8090
      - NC_ALLOW_LOCAL_EXTERNAL_DBS=true
      - NC_DISABLE_TELE=true
      - NC_APP_DB_HOST=db
      - NC_APP_DB_USER=${DB_USER}
      - NC_APP_DB_PASSWORD=${DB_PASSWORD}
      - NC_APP_DB_NAME=${DB_NAME}
    depends_on:
      - db
    restart: unless-stopped

  ai-backend:
    build:
      context: ./ai-backend
      dockerfile: Dockerfile
    container_name: mokart-ai-backend
    ports:
      - "8002:8000"
    env_file: .env
    restart: unless-stopped

  ai-front:
    build:
      context: ./ai-front
      dockerfile: Dockerfile
    container_name: mokart-ai-front
    ports:
      - "8003:4000"
    environment:
      - AGENT_API_URL=http://ai-backend:8000
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      - ai-backend
    restart: unless-stopped

volumes:
  postgres_data:
