<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokart Agent</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js" integrity="sha384-AgxQMf+yw6Uf1s6n3uAzYBsyrF1k2BTgReLMgQ6peEL0t+Hzeoe7Y4eHCCJCv7Pv" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js" integrity="sha384-AeEgFkf087ZqIN/5NMUXlVIztlAIvH1o7it8u1Aa5gH8hQ8Csqu+Il5p5xP1vGi1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js" integrity="sha384-98/l9hHglbRtzDENY6GVSeYAEf5Pop5GfEqWzVy9eVHRaf//syN43ipX9/qMYK/X" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js" integrity="sha384-3hthAOHhmLGjd5yY7eYMGWw3vwL5Bd0SYRBMYcx8msYQtPgWLrQs5HPS8PriZshn" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js" integrity="sha384-N8Fru6uIoG1GAhNMEwWdPMoiJC78q2pHl02Rgmh4KStxnmjmlzX17P7NmczonLv4" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>

    <!-- ── EMPTY STATE ─────────────────────────────────── -->
    <div id="empty-state">
        <div class="empty-hero">
            <h1>Mokart Agent</h1>
            <p style="opacity:.6;font-size:.85rem;margin-top:.5rem">Tu discutes avec une intelligence artificielle. Ses réponses peuvent être fausses. Ne partage aucune donnée personnelle.</p>
        </div>
        <div id="empty-input-wrap">
            <div id="input-container">
                <textarea id="input" placeholder="Posez votre question..." rows="1" autofocus></textarea>
                <div class="input-actions">
                    <button id="send-btn" type="button" aria-label="Envoyer" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4l8 8-1.41 1.41L13 5.83V20h-2V5.83L4.41 13.41 3 12l9-8z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── CHAT LAYOUT ─────────────────────────────────── -->
    <div id="chat-layout">
        <div class="header">
            <div class="header-left">
                <div>
                    <h1>Mokart Agent</h1>
                    <div class="header-meta">
                        <div class="status-dot"></div>
                        <span class="model-badge">{{ llm_model }}</span>
                    </div>
                </div>
            </div>
            <div class="header-right"></div>
        </div>

        <div id="messages"></div>

        <div id="chat-input-area"></div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
