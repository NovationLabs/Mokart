[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mokart-agent"
version = "1.0.0"
description = "Mokart Agent — Assistant IA conversationnel"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.9",
    "langchain-core>=1.4.3",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "openai>=2.42.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version >= '3.11' and python_version < '3.13'",
    "sys_platform == 'darwin' and python_version >= '3.11' and python_version < '3.13'",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
