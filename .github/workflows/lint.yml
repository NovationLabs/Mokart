name: Lint & Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Annule le run précédent si on repousse sur la même branche/PR
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.9"
          args: check --output-format=github

  frontend:
    name: Front ${{ matrix.project }} (typecheck + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [app, web]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        # CI=true (défaut sur GitHub) fait échouer CRA sur les warnings ESLint.
        # À repasser à true une fois les warnings nettoyés.
        env:
          CI: "false"
        run: npm run build
