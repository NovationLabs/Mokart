name: SonarCloud Issues Export

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/sonar-issues-export.yml'
      - '.github/scripts/sonar_issues_export.py'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'
      - name: Export SonarCloud issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python .github/scripts/sonar_issues_export.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonarcloud-issues-${{ github.run_id }}
          path: sonar-report/
          if-no-files-found: error
          retention-days: 30
