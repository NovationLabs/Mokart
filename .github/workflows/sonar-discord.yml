name: SonarQube Discord (momo)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-discord-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install 'Pillow==11.3.0'
      - name: Restore previous quality counts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sonar-momo/state.json
          key: sonar-momo-dev-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-momo-dev-
      - name: Post SonarQube summary to Discord
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/sonar_discord.py
      - name: Save current quality counts
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sonar-momo/state.json
          key: sonar-momo-dev-${{ github.run_id }}-${{ github.run_attempt }}
