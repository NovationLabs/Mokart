services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    container_name: mokart-web-prod
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.railway
    container_name: mokart-api-prod
    ports:
      - "8081:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEMO_MODE=${DEMO_MODE:-false}
    depends_on:
      - db
    restart: always

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    container_name: mokart-app-prod
    ports:
      - "8000:80"
    environment:
      - REACT_APP_API_URL=https://api.mokart.fr
    depends_on:
      - api
    restart: always

  db:
    image: postgres:15-alpine
    container_name: mokart-db-prod
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

volumes:
  postgres_data_prod:
