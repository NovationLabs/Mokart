<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Primary -->
    <title>Mokart</title>
    <meta name="description" content="Mokart brings lap timing, trajectory and movement together with a wheel-mounted karting telemetry prototype and a session dashboard.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />

    <!-- Open Graph / Facebook / LinkedIn (Controls preview when sharing link) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mokart — Race data" />
    <meta property="og:description" content="Karting telemetry from the steering wheel to the session view." />
    <meta property="og:image" content="%PUBLIC_URL%/prototype/mokart_prototype.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mokart — Race data" />
    <meta name="twitter:description" content="Karting telemetry from the steering wheel to the session view." />
    <meta name="twitter:image" content="%PUBLIC_URL%/prototype/mokart_prototype.png" />

    <link rel="preload" href="%PUBLIC_URL%/fonts/Iliad-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="%PUBLIC_URL%/fonts/Iliad-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <style>
        @font-face {
            font-family: 'Iliad';
            src: url('%PUBLIC_URL%/fonts/Iliad-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Iliad';
            src: url('%PUBLIC_URL%/fonts/Iliad-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Iliad';
            src: url('%PUBLIC_URL%/fonts/Iliad-Light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
